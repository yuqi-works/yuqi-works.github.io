<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 — YUQI WORKS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0b0b0d;
    color: #f5f3ee;
    font-family: "Archivo", "Inter", -apple-system, "Segoe UI", sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    -webkit-font-smoothing: antialiased;
  }
  .brand {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: #8f8c84;
    margin-bottom: 56px;
  }
  .brand em { color: #e8963c; font-style: normal; }
  .code {
    font-size: clamp(96px, 22vw, 200px);
    font-weight: 200;
    line-height: 1;
    letter-spacing: -0.03em;
    color: #f5f3ee;
  }
  .code span { color: #e8963c; }
  h1 {
    font-size: clamp(18px, 3vw, 26px);
    font-weight: 500;
    letter-spacing: 0.06em;
    margin: 24px 0 12px;
  }
  p {
    color: #8f8c84;
    font-size: 14px;
    line-height: 1.7;
    max-width: 40ch;
    margin-bottom: 44px;
  }
  a.btn {
    display: inline-block;
    background: #e8963c;
    color: #0b0b0d;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 14px 34px;
    border-radius: 999px;
    transition: box-shadow 0.25s ease, transform 0.15s ease;
  }
  a.btn:hover { box-shadow: 0 0 28px rgba(232, 150, 60, 0.35); }
  a.btn:active { transform: scale(0.98); }
</style>
</head>
<body>
  <div class="brand">YUQI<em>·</em>WORKS</div>
  <div class="code">4<span>0</span>4</div>
  <h1>Frame not found</h1>
  <p>That shot doesn't exist — or it's still on the cutting room floor. Either way, the good stuff is back home.</p>
  <a class="btn" href="/">BACK TO GALLERY</a>
</body>
</html>

<script>
const figs=[...document.querySelectorAll('.c')];
const picks=new Set();
figs.forEach(f=>f.addEventListener('click',()=>{
  const k=f.dataset.folder+'|'+f.dataset.file;
  if(picks.has(k)){picks.delete(k);f.classList.remove('pick')}
  else{picks.add(k);f.classList.add('pick')}
  document.getElementById('cnt').textContent='已选 '+picks.size;
}));
document.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  const f=b.dataset.f;
  figs.forEach(c=>{c.style.display=(f==='all'||c.dataset.folder===f)?'':'none'});
}));
document.getElementById('copy').addEventListener('click',()=>{
  const list=[...picks].map(k=>k.split('|').join(' / '));
  const txt=list.join('\n');
  navigator.clipboard.writeText(txt).then(()=>{
    const o=document.getElementById('out');
    o.style.display='block';o.textContent='已复制 '+list.length+' 张：\n'+txt;
  });
});
</script></body></html>
